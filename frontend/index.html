        async function fetchBooks() {
            try {
                const headers = getAuthHeaders();
                if (!headers) { window.location.href = 'login.html'; return; }
                const response = await fetch(${API_URL}/books, { headers });
                if (response.status === 401) return logout();
                const books = await response.json();
                const bookList = document.getElementById('bookList');
                bookList.innerHTML = '';
                books.forEach(book => {
                    const row = document.createElement('tr');
                    const pubDate = new Date(book.publication_date).toISOString().split('T')[0];
                    row.innerHTML = 
                        <td>${book.id}</td><td>${book.title}</td><td>${pubDate}</td><td>${book.pages}</td><td>${book.author}</td><td>${book.rate}</td>
                        <td>
                            <button onclick="editBook(${book.id}, '${book.title.replace(/'/g, "\\'")}', '${pubDate}', ${book.pages}, '${book.author.replace(/'/g, "\\'")}', ${book.rate})">Edytuj</button>
                            <button onclick="deleteBook(${book.id})">Usuń</button>
                        </td>;
                    bookList.appendChild(row);
                });
            } catch (error) { console.error('Fetch books error:', error); }
        }

        async function saveBook(event) {
            event.preventDefault();
            const id = document.getElementById('bookId').value;
            const book = {
                title: document.getElementById('title').value,
                publication_date: document.getElementById('publication_date').value,
                pages: parseInt(document.getElementById('pages').value),
                author: document.getElementById('author').value,
                rate: parseInt(document.getElementById('rate').value)
            };
            try {
                const headers = getAuthHeaders();
                if (!headers) { window.location.href = 'login.html'; return; }
                const method = id ? 'PUT' : 'POST';
                const url = id ? ${API_URL}/books/${id} : ${API_URL}/books;
                const response = await fetch(url, { method, headers, body: JSON.stringify(book) });
                if (response.status === 401) return logout();
                if (!response.ok) throw new Error((await response.json()).error);
                
                document.getElementById('bookForm').reset();
                document.getElementById('bookId').value = '';
                document.getElementById('cancelEdit').style.display = 'none';
                fetchBooks();
            } catch (error) { document.getElementById('error').textContent = error.message; }
        }

            document.getElementById('pages').value = pages;
            document.getElementById('author').value = author;
            document.getElementById('rate').value = rate;
            document.getElementById('cancelEdit').style.display = 'inline';
        }
